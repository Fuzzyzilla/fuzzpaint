[package]
name = "fuzzpaint"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fuzzpaint-core = { path = "../fuzzpaint-core" }
fuzzpaint-connection = { path = "../fuzzpaint-connection" }
fuzzpaint-logger = { path = "../fuzzpaint-logger" }
ahash = { version = "0.8.12", default-features = false, features = ["std"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
az = "1.2.1"
bitflags = { version = "2.10.0", features = ["bytemuck"] }
bytemuck = "1.24.0"
cgmath = "0.18.0"
crossbeam = "0.8.4"
defer = "0.2.1"
dhat = { version = "0.3.3", optional = true }
dirs = "6.0.0"
# To enable default-font within egui-winit
egui = "0.33.3"
egui-winit = { version = "=0.33.3", features = ["bytemuck"] }
either = "1.15.0"
env_logger = "0.11.8"
hashbrown = { version = "0.16.1", features = ["serde"] }
human_bytes = "0.4.3"
image = "0.25.9"
log = "0.4.29"
lyon_tessellation = "1.0.16"
octotablet = "0.1.0"
parking_lot = "0.12.5"
rfd = "0.16.0"
rustybuzz = "0.20.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
smallvec = { version = "1.15.1", features = ["serde", "union"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "sync",
    "rt",
    "macros",
    "parking_lot",
    "process"
] }
toml = "0.9.10"
try-block = "0.1.0"
ultraviolet = { version = "0.10.0", features = ["bytemuck"] }
vulkano = { version = "0.34.0", git = "https://github.com/fuzzyzilla/vulkano.git", branch = "backport-null-check"  }
vulkano-shaders = { version = "0.34.0", git = "https://github.com/fuzzyzilla/vulkano.git", branch = "backport-null-check"  }
# Can't inherit from egui_winit since it doesn't enable serde feature.
# Also need legacy RWH version for `vulkano` + new version for `octotablet`
winit = { version = "0.30.12", features = ["serde", "rwh_05", "rwh_06"] }
strum = { version = "0.27.2", features = ["derive"] }
png = "0.18.0"
# For low-level vulkan crimes, use the same version as vulkano.
ash = "^0.37.3"
oneshot = "0.1.11"
futures-util = "0.3.32"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.1", optional = true, default-features = false }

[features]
default = ["jemallocator"]
dhat_heap = ["dep:dhat"]
jemallocator = ["dep:tikv-jemallocator"]
