[package]
name = "fuzzpaint-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fuzzpaint-types = { path = "../fuzzpaint-types" }
anyhow = "1.0.100"
az = "1.2.1"
bitflags = { version = "2.10.0", features = ["bytemuck"] }
bitvec = { version = "1.0.1", default-features = false, features = [
    "alloc",
    "std",
] }
blake3 = "1.8.2"
chrono = { version = "0.4.42", default-features = false }
dirs = "6.0.0"
either = "1.15.0"
fontdb = "0.23.0"
hashbrown = { version = "0.16.1", features = ["serde"] }
human_bytes = "0.4.3"
id_tree = "1.8.0"
log = "0.4.29"
parking_lot = "0.12.5"
rangemap = "1.7.0"
rustybuzz = "0.20.1"
slab_tree = "0.3.2"
smallvec = { version = "1.15.1", features = ["serde", "union"] }
unicode-segmentation = "1.12.0"

bytemuck = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
